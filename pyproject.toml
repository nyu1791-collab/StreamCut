[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "streamcut-pipeline"
version = "0.1.1"
description = "A small Colab pipeline: parallel ASR, topic planning, selected alignment and one-pass rendering"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3",
  "Pillow>=11,<14",
  "fonttools>=4.55,<5",
  "fugashi==1.5.2",
  "unidic-lite==1.0.8",
]

[project.optional-dependencies]
gpu = ["whisperx==3.8.6", "faster-whisper==1.2.1"]
vad = ["faster-whisper==1.2.1"]
fetch = ["yt-dlp[default]>=2026.10.21"]
dev = ["pytest>=8,<9", "ruff>=0.14,<0.15", "build>=1,<2"]

[project.scripts]
streamcut = "streamcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real FFmpeg media checks; no GPU or external model"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
