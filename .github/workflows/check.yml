name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk
      - run: python -m pip install '.[dev,vad]'
      - run: ruff check . && ruff format --check src tests
      - run: pytest -q
      - run: python -m build
